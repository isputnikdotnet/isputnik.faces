<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">isputnik.faces app icon</title>
  <desc id="desc">A flat rounded square: a cream person inside viewfinder corners, a teal orbit passing behind them, and an orange satellite on the orbit.</desc>

  <rect width="512" height="512" rx="108" fill="#16213a"/>

  <!-- orbit, whole, behind the viewfinder -->
  <ellipse cx="250" cy="240" rx="222" ry="80" fill="none" stroke="#5fb8b0" stroke-width="22" transform="rotate(-24 250 240)"/>

  <!-- viewfinder: a navy backing hides the orbit inside it, then the four corners -->
  <rect x="160" y="172" width="192" height="192" rx="28" fill="#16213a"/>
  <path d="M160 222v-22a28 28 0 0 1 28-28h22M302 172h22a28 28 0 0 1 28 28v22M352 314v22a28 28 0 0 1-28 28h-22M210 364h-22a28 28 0 0 1-28-28v-22" fill="none" stroke="#f1f3ee" stroke-width="22" stroke-linecap="round"/>

  <!-- the person -->
  <circle cx="256" cy="238" r="36" fill="#f1f3ee"/>
  <path d="M196 340c4-38 28-58 60-58s56 20 60 58Z" fill="#f1f3ee"/>

  <!-- satellite; the navy stroke breaks the orbit around it -->
  <circle cx="397.5" cy="124.1" r="32" fill="#e9a95f" stroke="#16213a" stroke-width="16"/>
</svg>
